name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pgrx toolchain
        run: |
          cargo install --locked cargo-pgrx --version 0.18.0
          cargo pgrx init --pg17 download
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --no-default-features --features 'pg17 pg_test'
      - name: Unit tests
        run: cargo test --no-default-features --features 'pg17 pg_test'
      - name: Regression tests
        run: |
          cargo pgrx regress pg17 --resetdb \
            --postgresql-conf shared_preload_libraries=pg_wal_budget \
            --postgresql-conf compute_query_id=on
