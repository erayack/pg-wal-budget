[package]
name = "pg_wal_budget"
version = "0.2.0"
edition = "2024"
description = "PostgreSQL extension for observing and enforcing WAL-generation budgets by policy scope"
license = "Apache-2.0"
repository = "https://github.com/erayack/pg-wal-budget"
readme = "README.md"
keywords = ["postgresql", "extension", "wal", "budget"]
categories = ["database"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg_test = []

[dependencies]
pgrx = "=0.18.0"
serde = { version = "1.0.219", features = ["derive"], optional = true }

[dev-dependencies]
pgrx-tests = "=0.18.0"

[lints.rust]
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }
perf = { level = "deny", priority = 9 }
pedantic = { level = "warn", priority = 3 }
nursery = { level = "warn", priority = 2 }
needless_collect = { level = "deny", priority = 11 }
redundant_pub_crate = { level = "allow", priority = 12 }
redundant_clone = { level = "deny", priority = 11 }
unnecessary_wraps = { level = "deny", priority = 11 }
unwrap_used = { level = "deny", priority = 8 }
expect_used = { level = "deny", priority = 8 }
dbg_macro = { level = "deny", priority = 8 }
todo = { level = "warn", priority = 8 }
unimplemented = { level = "deny", priority = 8 }
print_stdout = { level = "deny", priority = 8 }
print_stderr = { level = "deny", priority = 8 }
mem_forget = { level = "deny", priority = 8 }
undocumented_unsafe_blocks = { level = "deny", priority = 8 }

[profile.dev]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = 1
incremental = false
overflow-checks = true

[profile.test]
opt-level = 1
debug = 2
